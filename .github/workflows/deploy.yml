name: Testar e publicar no GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write   # necessário para publicar a dist na branch gh-pages
  pages: write      # necessário para deploy no GitHub Pages
  id-token: write   # necessário para autenticação OIDC

concurrency:
  group: pages-deploy
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Instalar dependências
        run: npm ci

      - name: Testes do motor (vitest)
        run: npm test

      - name: Build de produção
        run: npm run build

      - name: Upload de artefatos para Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

      - name: Deploy para GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      # O servidor multiplayer (Render) importa src/match.js e src/engine.js, então
      # precisa acompanhar cada mudança na coleção de cartas. O auto-deploy do Render
      # não enxerga alterações fora de server/, o que congelava o servidor numa versão
      # antiga e bloqueava o multiplayer pela divergência de CONTENT_SIG. O deploy hook
      # equivale a apertar "Manual Deploy" e vale para qualquer commit.
      - name: Redeploy do servidor no Render
        env:
          HOOK: ${{ secrets.RENDER_DEPLOY_HOOK }}
        run: |
          if [ -z "$HOOK" ]; then
            echo "RENDER_DEPLOY_HOOK não configurado — servidor não foi redeployado."
            exit 0
          fi
          curl -fsS -X POST "$HOOK" -o /dev/null
          echo "Deploy do servidor disparado no Render."
