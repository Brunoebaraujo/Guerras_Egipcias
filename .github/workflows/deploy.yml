name: Testar e publicar no GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write   # necessário para publicar a dist na branch gh-pages

concurrency:
  group: pages-deploy
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependências
        run: npm ci

      - name: Instalar dependências do servidor
        run: npm ci --prefix server

      - name: Lint
        run: npm run lint

      - name: Verificação incremental de tipos
        run: npm run typecheck

      - name: Testes do motor (vitest)
        run: npm test

      - name: Testes de integração do servidor
        run: npm run test:server

      - name: Build de produção
        run: npm run build

      - name: Publicar dist/ na branch gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          force_orphan: true
          cname: ""
          commit_message: "deploy: atualiza via Actions"

      - name: Detectar mudanças que afetam o servidor
        id: server_changes
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] || \
             git diff --quiet HEAD^ HEAD -- server/ src/domain/ src/match/ src/net/ src/storage/ src/engine.js src/match.js src/deckLibrary.js src/rules.js; then
            if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
              echo "changed=true" >> "$GITHUB_OUTPUT"
            else
              echo "changed=false" >> "$GITHUB_OUTPUT"
            fi
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      # O servidor importa módulos compartilhados de src/. O hook só é acionado
      # quando esses contratos ou o próprio servidor mudam; CSS/arte não encerram
      # mais partidas em andamento por um redeploy desnecessário.
      - name: Redeploy do servidor no Render
        if: steps.server_changes.outputs.changed == 'true'
        env:
          HOOK: ${{ secrets.RENDER_DEPLOY_HOOK }}
        run: |
          if [ -z "$HOOK" ]; then
            echo "RENDER_DEPLOY_HOOK não configurado — servidor não foi redeployado."
            exit 0
          fi
          curl -fsS -X POST "$HOOK" -o /dev/null
          echo "Deploy do servidor disparado no Render."
