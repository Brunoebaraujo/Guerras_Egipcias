name: Rollback do site

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Commit ou tag estável para republicar
        required: true
        type: string

jobs:
  rollback-site:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - name: Republicar versão estável
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          force_orphan: true
          commit_message: "rollback: ${{ inputs.ref }}"
